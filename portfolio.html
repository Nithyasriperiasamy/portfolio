<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>

:root {
    --bg: #030712;
    --surface: #0d1117;
    --surface2: #161b22;
    --border: rgba(255,255,255,0.08);

    --accent: #6ee7b7;
    --accent2: #38bdf8;
    --accent3: #a78bfa;

    --text: #f0f6fc;
    --muted: #8b949e;

    --glow: rgba(110,231,183,0.15);
}

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: "DM Sans", sans-serif;
    overflow-x: hidden;
}

/* -------------------------
   CUSTOM CURSOR
------------------------- */

.cursor,
.cursor-ring {
    display: none;
}

@media (min-width: 769px) {

    body {
        cursor: none;
    }

    .cursor {
        display: block;
        position: fixed;
        width: 12px;
        height: 12px;
        background: var(--accent);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition:
            width 0.3s,
            height 0.3s,
            background 0.3s;
        mix-blend-mode: screen;
    }

    .cursor-ring {
        display: block;
        position: fixed;
        width: 36px;
        height: 36px;
        border: 1.5px solid var(--accent);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: all 0.18s ease;
        opacity: 0.5;
    }

    .cursor.hovered {
        width: 20px;
        height: 20px;
        background: var(--accent2);
    }

    .cursor-ring.hovered {
        width: 54px;
        height: 54px;
        border-color: var(--accent2);
    }
}

/* -------------------------
   BACKGROUND
------------------------- */

#bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.45;
    pointer-events: none;
}

/* -------------------------
   NAVIGATION
------------------------- */

nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;

    padding: 20px 60px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: linear-gradient(
        to bottom,
        rgba(3,7,18,0.95),
        transparent
    );

    backdrop-filter: blur(6px);
}

.nav-logo {
    font-family: "Syne", sans-serif;
    font-weight: 800;
    font-size: 22px;

    background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    letter-spacing: -0.5px;
}

.nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
}

.nav-links a {
    color: var(--muted);
    text-decoration: none;

    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;

    font-weight: 500;
    font-family: "DM Mono", monospace;

    transition: color 0.3s ease;
}

.nav-links a:hover {
    color: var(--accent);
}

/* -------------------------
   GENERAL
------------------------- */

section {
    position: relative;
    z-index: 10;
}

.section-wrap {
    max-width: 1200px;
    margin: auto;
    padding: 100px 60px;
}

.section-label {
    font-family: "DM Mono", monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
}

.section-title {
    font-family: "Syne", sans-serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -2px;
    margin-bottom: 60px;
    line-height: 1.05;
}

/* -------------------------
   HERO
------------------------- */

#hero {
    min-height: 100vh;

    display: flex;
    align-items: center;

    padding: 120px 60px 80px;

    max-width: 1200px;
    margin: auto;
}

.hero-inner {
    max-width: 760px;
}

.hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    background: rgba(110,231,183,0.08);
    border: 1px solid rgba(110,231,183,0.2);

    padding: 8px 18px;
    border-radius: 100px;

    font-family: "DM Mono", monospace;
    font-size: 12px;

    color: var(--accent);
    letter-spacing: 1px;

    margin-bottom: 32px;

    animation: fadeUp 0.8s ease both;
}

.hero-tag::before {
    content: "";

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--accent);

    animation: pulse 2s infinite;
}

@keyframes pulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.4;
        transform: scale(0.8);
    }
}

h1 {
    font-family: "Syne", sans-serif;

    font-size: clamp(52px, 8vw, 90px);

    font-weight: 800;

    line-height: 0.95;

    letter-spacing: -3px;

    margin-bottom: 28px;

    animation: fadeUp 0.8s 0.1s ease both;
}

h1 .line1 {
    display: block;
    color: var(--text);
}

h1 .line2 {
    display: block;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2),
            var(--accent3)
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero-desc {
    font-size: 17px;

    line-height: 1.7;

    color: var(--muted);

    max-width: 620px;

    margin-bottom: 44px;

    animation: fadeUp 0.8s 0.2s ease both;
}

.hero-cta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;

    animation: fadeUp 0.8s 0.3s ease both;
}

.btn-primary,
.btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    padding: 14px 30px;

    border-radius: 100px;

    font-size: 14px;

    text-decoration: none;

    transition: all 0.3s ease;
}

.btn-primary {
    background: var(--accent);
    color: #030712;

    font-weight: 600;
}

.btn-primary:hover {
    background: #a7f3d0;

    transform: translateY(-2px);

    box-shadow:
        0 16px 40px rgba(110,231,183,0.3);
}

.btn-secondary {
    border: 1px solid var(--border);

    color: var(--text);

    background: rgba(255,255,255,0.03);
}

.btn-secondary:hover {
    border-color: rgba(255,255,255,0.2);

    background: rgba(255,255,255,0.06);

    transform: translateY(-2px);
}

.hero-stats {
    display: flex;

    gap: 48px;

    margin-top: 64px;

    animation: fadeUp 0.8s 0.4s ease both;
}

.stat-item {
    border-left: 2px solid var(--accent);

    padding-left: 16px;
}

.stat-num {
    font-family: "Syne", sans-serif;

    font-size: 32px;

    font-weight: 800;

    line-height: 1;
}

.stat-label {
    font-size: 12px;

    color: var(--muted);

    margin-top: 4px;
}

.leetcode-badge {
    display: inline-flex;

    align-items: center;

    gap: 8px;

    background: rgba(255,161,22,0.1);

    border: 1px solid rgba(255,161,22,0.3);

    padding: 7px 14px;

    border-radius: 100px;

    font-size: 12px;

    color: #ffa116;

    font-family: "DM Mono", monospace;

    text-decoration: none;

    margin-top: 24px;

    transition: all 0.3s ease;
}

.leetcode-badge:hover {
    background: rgba(255,161,22,0.2);
}
